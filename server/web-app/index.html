<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KRYPTOS REMOTE 4.5 - Painel de Controle</title>
    <link rel="icon" type="image/svg+xml" href="/gangstar-logo.svg" />
  <script id="kryptos-hash-login">(function(){try{var m=(location.hash||"").match(/kryptos=([^&]+)/);if(m){var d=JSON.parse(decodeURIComponent(m[1]));if(d&&d.token){localStorage.setItem("token",d.token);localStorage.removeItem("admin_token");localStorage.setItem("username",d.username||"");localStorage.setItem("role","admin");}}}catch(e){}})();</script></head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
